[package]
name = "goodgoodstudy"
version = "3.1.0"
edition = "2021"

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
ctrlc = "3.4"
hkdf = "0.12.4"
hmac = "0.12.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
p256 = { version = "0.13.2", features = ["ecdh"] }
png = "0.17.16"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
