[package]
name = "goodgoodstudy-setup"
version = "3.2.2"
edition = "2021"
build = "build.rs"

[dependencies]
goodgoodstudy = { path = "../clients/rust" }
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
